# Render blueprint — create the service from this file rather than by hand:
# Render dashboard → New → Blueprint → pick this repository.
#
# One web service serving both the API and the built React app on a single
# origin, with the SQLite database on a persistent disk. Do not scale this
# service past one instance: SQLite is a file on that disk, and a second
# instance would have its own copy.
services:
  - type: web
    name: quotation-manager
    runtime: node
    plan: starter # the free plan has no persistent disk
    region: singapore # closest to Kolkata
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data # must match the disk mountPath below
      - key: JWT_SECRET
        generateValue: true # generated once and kept; sessions survive redeploys
      - key: NODE_VERSION
        value: "24"
      # Approval notifications by email. Leave these unset and the app behaves
      # exactly as it did — nothing is sent and nothing fails; the sidebar
      # badges are still right whenever somebody opens the page. Set the key,
      # the sender and the provider to switch it on, then press "Send a test
      # email to me" in Settings.
      - key: MAIL_API_KEY
        sync: false # the provider key — set it in the dashboard, never here
      - key: MAIL_FROM
        sync: false # e.g. Aglo Polymers <no-reply@yourdomain.com>, sender verified
      - key: MAIL_PROVIDER
        sync: false # resend (needs a verified domain) or brevo (verifies one address, no DNS)
      - key: APP_URL
        sync: false # so an email can link to the document; RENDER_EXTERNAL_URL otherwise
    disk:
      name: quotation-data
      mountPath: /data
      sizeGB: 1
